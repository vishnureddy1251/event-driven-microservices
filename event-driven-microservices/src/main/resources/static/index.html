<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Student Grading System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #6c757d;
            margin-top: 10px;
        }

        .students-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .students-table th,
        .students-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .students-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        .students-table tr:hover {
            background: #f8f9fa;
        }

        .grade-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
            color: white;
        }

        .grade-A { background: #28a745; }
        .grade-B { background: #17a2b8; }
        .grade-C { background: #ffc107; color: #333; }
        .grade-D { background: #fd7e14; }
        .grade-F { background: #dc3545; }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #666;
            font-size: 0.9em;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📚 Student Grading System</h1>
            <p>Event-Driven Microservices Architecture</p>
        </div>

        <!-- Statistics -->
        <div class="stats" id="stats">
            <div class="stat-card">
                <h3 id="totalStudents">0</h3>
                <p>Total Students</p>
            </div>
            <div class="stat-card">
                <h3 id="averageScore">0</h3>
                <p>Average Score</p>
            </div>
            <div class="stat-card">
                <h3 id="topStudents">0</h3>
                <p>Honor Students</p>
            </div>
            <div class="stat-card">
                <h3 id="failingStudents">0</h3>
                <p>Need Attention</p>
            </div>
        </div>

        <!-- Submit Grade Form -->
        <div class="card">
            <h2>📝 Submit New Grade</h2>
            <div id="message" class="message"></div>
            
            <form id="gradeForm">
                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" name="name" required placeholder="Enter student name">
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <select id="subject" name="subject" required>
                        <option value="">Select a subject</option>
                        <option value="Math">Math</option>
                        <option value="Science">Science</option>
                        <option value="English">English</option>
                        <option value="History">History</option>
                        <option value="Art">Art</option>
                        <option value="Computer Science">Computer Science</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="score">Score (0-100)</label>
                    <input type="number" id="score" name="score" min="0" max="100" required placeholder="Enter score">
                </div>

                <button type="submit" class="btn">Submit Grade</button>
                <button type="button" class="btn btn-secondary" onclick="processEvents()">Process Events from Queue</button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing...</p>
            </div>
        </div>

        <!-- Students List -->
        <div class="card">
            <h2>👥 All Students</h2>
            <button class="btn btn-secondary" onclick="loadStudents()">🔄 Refresh List</button>
            
            <table class="students-table" id="studentsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Subject</th>
                        <th>Score</th>
                        <th>Grade</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                    <tr>
                        <td colspan="6" style="text-align: center;">No students yet. Submit a grade to get started!</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const API_BASE_URL = 'http://localhost:8080/api/grades';

        // ==========================================
        // FORM SUBMISSION
        // ==========================================
        document.getElementById('gradeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('studentName').value,
                subject: document.getElementById('subject').value,
                score: parseInt(document.getElementById('score').value)
            };

            showLoading(true);
            hideMessage();

            try {
                const response = await fetch(`${API_BASE_URL}/submit`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    const student = await response.json();
                    showMessage(`✅ Grade submitted successfully! ${student.name} received a ${student.grade}`, 'success');
                    document.getElementById('gradeForm').reset();
                    
                    // Refresh data
                    setTimeout(() => {
                        loadStudents();
                        loadStatistics();
                    }, 1000);
                } else {
                    showMessage('❌ Error submitting grade. Please try again.', 'error');
                }
            } catch (error) {
                showMessage('❌ Network error. Make sure the backend is running on http://localhost:8080', 'error');
                console.error('Error:', error);
            } finally {
                showLoading(false);
            }
        });

        // ==========================================
        // LOAD STUDENTS
        // ==========================================
        async function loadStudents() {
            try {
                const response = await fetch(`${API_BASE_URL}/students`);
                const students = await response.json();

                const tbody = document.getElementById('studentsTableBody');
                
                if (students.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No students yet. Submit a grade to get started!</td></tr>';
                    return;
                }

                tbody.innerHTML = students.map(student => `
                    <tr>
                        <td>${student.id}</td>
                        <td><strong>${student.name}</strong></td>
                        <td>${student.subject}</td>
                        <td>${student.score}</td>
                        <td><span class="grade-badge grade-${student.grade}">${student.grade}</span></td>
                        <td>${getStatus(student.grade)}</td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error loading students:', error);
            }
        }

        // ==========================================
        // LOAD STATISTICS
        // ==========================================
        async function loadStatistics() {
            try {
                const response = await fetch(`${API_BASE_URL}/stats`);
                const stats = await response.json();

                document.getElementById('totalStudents').textContent = stats.totalStudents || 0;
                document.getElementById('averageScore').textContent = stats.averageScore?.toFixed(1) || '0.0';
                document.getElementById('topStudents').textContent = stats.topStudents || 0;
                document.getElementById('failingStudents').textContent = stats.failingStudents || 0;
            } catch (error) {
                console.error('Error loading statistics:', error);
            }
        }

        // ==========================================
        // PROCESS EVENTS
        // ==========================================
        async function processEvents() {
            showLoading(true);
            hideMessage();

            try {
                const response = await fetch(`${API_BASE_URL}/process-all`, {
                    method: 'POST'
                });

                if (response.ok) {
                    const result = await response.json();
                    showMessage(`✅ Processed ${result.eventsProcessed} event(s) from SQS queue!`, 'success');
                    
                    setTimeout(() => {
                        loadStudents();
                        loadStatistics();
                    }, 1000);
                } else {
                    showMessage('❌ Error processing events.', 'error');
                }
            } catch (error) {
                showMessage('❌ Network error. Make sure the backend is running.', 'error');
                console.error('Error:', error);
            } finally {
                showLoading(false);
            }
        }

        // ==========================================
        // HELPER FUNCTIONS
        // ==========================================
        function getStatus(grade) {
            switch(grade) {
                case 'A': return '🌟 Excellent';
                case 'B': return '🎉 Good';
                case 'C': return '📋 Average';
                case 'D': return '⚠️ Below Average';
                case 'F': return '❌ Failing';
                default: return '❓ Unknown';
            }
        }

        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';
        }

        function hideMessage() {
            document.getElementById('message').style.display = 'none';
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('gradeForm').style.display = show ? 'none' : 'block';
        }

        // ==========================================
        // INITIALIZE
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            loadStudents();
            loadStatistics();
            
            // Auto-refresh every 30 seconds
            setInterval(() => {
                loadStudents();
                loadStatistics();
            }, 30000);
        });
    </script>
</body>
</html>
